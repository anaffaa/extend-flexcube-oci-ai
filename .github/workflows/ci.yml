name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        working-directory: foundation/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Shell scripts parse
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Notebooks match their sources
        run: python3 tools/build_notebooks.py --check
      - name: Sample data integrity
        run: |
          pip install duckdb
          python3 foundation/source/sample-bank/generator/validate.py

  pipeline:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run the pipeline on the sample bank
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          pip install pyspark==3.5.3 scikit-learn mlflow pandas
          MLFLOW_TRACKING_URI=file://$PWD/.mlruns python3 tests/local/run_pipeline_local.py .
