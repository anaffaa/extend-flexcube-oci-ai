title: "Extend FLEXCUBE on OCI: AI foundation"
description: "Network, Vault, staging bucket, Oracle AI Data Platform, IAM policies, operations topic and an optional synthetic FLEXCUBE sample bank."
schemaVersion: 1.1.0
version: "1.0.0"
locale: "en"

variableGroups:
  - title: "Hidden"
    visible: false
    variables:
      - tenancy_ocid
      - region
      - freeform_tags

  - title: "Placement"
    variables:
      - compartment_ocid
      - create_compartment
      - compartment_name
      - prefix

  - title: "Network"
    variables:
      - vcn_cidr
      - data_subnet_cidr

  - title: "Oracle AI Data Platform"
    variables:
      - aidp_display_name
      - aidp_workspace_name
      - create_iam_policies
      - aidp_admin_group
      - enable_private_network_policies

  - title: "FLEXCUBE source"
    variables:
      - deploy_sample_source
      - sample_db_name
      - sample_db_ecpu
      - sample_db_storage_gb
      - sample_db_private_endpoint
      - sample_db_allowed_cidrs

  - title: "Operations"
    variables:
      - notification_email

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Where the resources are created, or the parent of a new compartment."
    required: true

  create_compartment:
    type: boolean
    title: "Create a new child compartment"
    default: false

  compartment_name:
    type: string
    title: "New compartment name"
    default: "flexcube-ai-extension"
    visible: create_compartment

  prefix:
    type: string
    title: "Resource name prefix"
    description: "Lower case letters and digits, 2 to 12 characters."
    default: "fcubs"
    pattern: "^[a-z][a-z0-9]{1,11}$"

  vcn_cidr:
    type: string
    title: "VCN CIDR"
    default: "10.80.0.0/16"
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  data_subnet_cidr:
    type: string
    title: "Private data subnet CIDR"
    default: "10.80.10.0/24"
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  aidp_display_name:
    type: string
    title: "AI Data Platform name"
    default: "flexcube-ai"

  aidp_workspace_name:
    type: string
    title: "Default workspace name"
    default: "flexcube"

  create_iam_policies:
    type: boolean
    title: "Create the IAM policies AI Data Platform needs"
    description: "Needs permission to manage policies in the tenancy. Clear it if your administrator creates them (statements in docs/foundation/01_prerequisites_and_iam.md)."
    default: true

  aidp_admin_group:
    type: string
    title: "Administrator group (optional)"
    description: "Group allowed to manage AI Data Platform and Autonomous AI Database in this compartment. Format: group name, or 'Domain'/'group'."
    default: ""
    visible: create_iam_policies

  enable_private_network_policies:
    type: boolean
    title: "Allow AI Data Platform to use the private subnet"
    default: true
    visible: create_iam_policies

  deploy_sample_source:
    type: boolean
    title: "Create the synthetic FLEXCUBE sample bank database"
    description: "Clear it to connect your own FLEXCUBE copy (on OCI, on premises, Exadata Cloud@Customer or Oracle Database@Azure)."
    default: true

  sample_db_name:
    type: string
    title: "Sample database name"
    default: "FCUBSDEMO"
    pattern: "^[A-Za-z][A-Za-z0-9]{0,13}$"
    visible: deploy_sample_source

  sample_db_ecpu:
    type: integer
    title: "Sample database ECPUs"
    default: 2
    minimum: 2
    maximum: 16
    visible: deploy_sample_source

  sample_db_storage_gb:
    type: integer
    title: "Sample database storage (GB)"
    default: 20
    minimum: 20
    visible: deploy_sample_source

  sample_db_private_endpoint:
    type: boolean
    title: "Private endpoint for the sample database"
    description: "Recommended for anything beyond a first trial. Loading then needs a host inside the VCN or a bastion."
    default: false
    visible: deploy_sample_source

  sample_db_allowed_cidrs:
    type: array
    items:
      type: string
    title: "Allowed client CIDRs (public endpoint only)"
    description: "For example your office egress range. Empty means no network allow list."
    default: []
    visible:
      and:
        - deploy_sample_source
        - not:
            - sample_db_private_endpoint

  notification_email:
    type: string
    title: "Operations email (optional)"
    description: "Subscribed to the operations topic; confirm the subscription email."
    default: ""

outputGroups:
  - title: "Foundation"
    outputs:
      - aidp_id
      - aidp_workspace
      - staging_bucket
      - vault_id
      - secret_ids
      - sample_source_db_id
      - next_steps

outputs:
  aidp_id:
    type: ocid
    title: "AI Data Platform"
  aidp_workspace:
    type: string
    title: "Workspace"
  staging_bucket:
    type: string
    title: "Staging bucket"
  vault_id:
    type: ocid
    title: "Vault"
  secret_ids:
    type: map
    title: "Generated password secrets"
  sample_source_db_id:
    type: ocid
    title: "Sample FLEXCUBE database"
  next_steps:
    type: string
    title: "Next steps"
